name: saglik_yaninda
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.1
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_messaging: ^16.1.3
  timezone: ^0.9.2
  flutter_local_notifications: ^17.2.2
  shared_preferences: ^2.5.5
  table_calendar: ^3.1.0  
  intl: ^0.19.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10
  shimmer: ^3.0.0
  connectivity_plus: ^7.1.1
  cloud_functions: ^6.3.5
 


dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^6.0.0




flutter:
  assets:
    - assets/icons/
  

  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png" # Logonun yolu
  min_sdk_android: 21 # Android için minimum gereksinim

flutter_native_splash:
  color: "#F4F6F9" # Arka plan rengi (Bizim uygulamanın ferah buz grisi)
  image: "assets/images/app_logo.png" # Logonun yolu
  android: true
  ios: true
  android_12:
    image: "assets/images/app_logo.png"
    icon_background_color: "#F4F6F9"